spring.application.name=url-shortener
server.port=${PORT:8080}
server.shutdown=graceful

# --- Supabase PostgreSQL (use the pooler connection string) ---
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://aws-0-eu-west-1.pooler.supabase.com:5432/postgres}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres.uajqbxmvufofnkmtpkix}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:vzk9t3RQVaAWr,9}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.max-lifetime=1500000

# 'update' creates the table on first run; use 'validate' once db/schema.sql has been applied
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# --- Redis (redis:// or rediss:// for TLS providers such as Upstash) ---
spring.data.redis.url=${REDIS_URL:redis://localhost:6379}
spring.data.redis.timeout=500ms
spring.data.redis.connect-timeout=1s

# --- Application ---
app.base-url=${APP_BASE_URL:http://localhost:8080}
app.redirect-status=${APP_REDIRECT_STATUS:302}
app.code-length=${APP_CODE_LENGTH:7}
app.cache-ttl=${APP_CACHE_TTL:24h}
app.cleanup-cron=${APP_CLEANUP_CRON:0 0 * * * *}
app.cleanup-batch-size=${APP_CLEANUP_BATCH_SIZE:500}

# --- Docs / ops ---
springdoc.swagger-ui.path=/swagger-ui.html
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
