openapi: 3.0.1
info:
  title: URL Shortener API
  version: v1
servers:
  - url: http://localhost:8080
tags:
  - name: URLs
    description: Create short URLs and read their statistics
  - name: Redirect
paths:
  /api/v1/urls:
    post:
      tags: [URLs]
      summary: Create a short URL
      description: Optionally supply a custom alias and/or an expiration timestamp. If the alias is already in use, a generated short code is used instead and `message` explains it.
      operationId: create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUrlRequest'
      responses:
        '201':
          description: Short URL created
          headers:
            Location:
              schema:
                type: string
                format: uri
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UrlResponse'
        '400':
          $ref: '#/components/responses/Error'
        '503':
          description: Could not generate a unique short code, retry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/urls/{shortCode}/stats:
    get:
      tags: [URLs]
      summary: Get click count and metadata for a short code
      operationId: stats
      parameters:
        - $ref: '#/components/parameters/ShortCode'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UrlStatsResponse'
        '404':
          description: Short code not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /{shortCode}:
    get:
      tags: [Redirect]
      summary: Redirect to the original URL
      operationId: redirect
      parameters:
        - name: shortCode
          in: path
          required: true
          schema:
            type: string
            pattern: '^[A-Za-z0-9_-]{3,32}$'
      responses:
        '302':
          description: Redirect to the original URL (301 if app.redirect-status=301)
          headers:
            Location:
              schema:
                type: string
                format: uri
        '404':
          description: Short code not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '410':
          description: Short URL has expired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  parameters:
    ShortCode:
      name: shortCode
      in: path
      required: true
      schema:
        type: string
  responses:
    Error:
      description: Validation failed or malformed request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    CreateUrlRequest:
      type: object
      description: Request to create a short URL
      required: [url]
      properties:
        url:
          type: string
          example: https://example.com/some/very/long/path?x=1
        customAlias:
          type: string
          pattern: '^[A-Za-z0-9_-]{3,32}$'
          description: "Optional custom alias (3-32 chars: letters, digits, '_' or '-')"
          example: my-link
        expiresAt:
          type: string
          format: date-time
          description: Optional expiration timestamp (ISO-8601, must be in the future)
          example: 2030-01-01T00:00:00Z
    UrlResponse:
      type: object
      properties:
        shortCode:
          type: string
        shortUrl:
          type: string
        originalUrl:
          type: string
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
          nullable: true
        message:
          type: string
          description: Present only when the requested alias could not be used
    UrlStatsResponse:
      type: object
      properties:
        shortCode:
          type: string
        shortUrl:
          type: string
        originalUrl:
          type: string
        clickCount:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
          nullable: true
        expired:
          type: boolean
        customAlias:
          type: boolean
    ErrorResponse:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        status:
          type: integer
        error:
          type: string
        message:
          type: string
        path:
          type: string
        fieldErrors:
          type: array
          items:
            $ref: '#/components/schemas/FieldViolation'
    FieldViolation:
      type: object
      properties:
        field:
          type: string
        message:
          type: string
